[build]
  # Build the site, then the Sanity Studio into build/studio (served at /studio)
  command = "npm run build && cd gb-jojo && npm ci && npx sanity build ../build/studio --yes"
  publish = "build"

[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking — disallow this site from being embedded in iframes
    X-Frame-Options = "DENY"

    # Prevent MIME-type sniffing attacks
    X-Content-Type-Options = "nosniff"

    # Control referrer information sent to third-party sites
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Enforce HTTPS for 1 year, including subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Restrict access to browser features not needed by this app
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
